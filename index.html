<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yuwie’s apology</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe3ee;--card:#fff;--ink:#3a2330;--pink:#ff7aa8;--pink2:#ffc2d9;--grey:#d9d2d6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1822;--card:#3a2330;--ink:#ffe9f1;--grey:#6b5560}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
main{background:var(--card);border-radius:32px;padding:28px 22px;width:100%;max-width:460px;text-align:center;box-shadow:0 10px 0 var(--pink2)}
img{width:70%;max-width:260px;border-radius:20px;background:#fff;display:block;margin:0 auto 12px}
h1{font-size:1.5rem;font-weight:600;margin:0 0 8px;line-height:1.25}
#msg{min-height:3rem;margin:0 0 16px;font-size:1.1rem;color:var(--pink)}
.btns{display:flex;justify-content:center;align-items:center;gap:14px;min-height:130px}
button{font-family:inherit;font-weight:600;border:0;border-radius:999px;cursor:pointer;color:#fff;transition:all .25s;white-space:nowrap;overflow:hidden}
#yes{background:var(--pink);font-size:1.2rem;padding:12px 30px}
#no{background:#8a7a84;font-size:1.2rem;padding:12px 30px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#thanks{display:none}
#thanks p{font-size:1.4rem;font-weight:600;margin:6px 0}
</style></head>
